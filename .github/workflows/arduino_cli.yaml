name: Arduino IDE Library CI
on:
  workflow_call:
  push:
    branches:
      - '**'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - name: actuators
          - name: sensors
          - name: child_devices
          - name: gateway_and_lifecycle

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Arduino CLI core and packages
        id: arduino-cache
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: ${{ runner.os }}-arduino-${{ hashFiles('.github/workflows/arduino_cli.yaml') }}
          restore-keys: |
            ${{ runner.os }}-arduino-

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        if: steps.arduino-cache.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Install library dependencies
        run: |
          arduino-cli lib install MQTT@2.5.2
          arduino-cli lib install MQTTRemote@6.0.5
          arduino-cli lib install ArduinoJson@7.4.3

      - name: Install repo as library
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          ln -s "$PWD" "$HOME/Arduino/libraries/."

      - name: Compile Sketch
        run: arduino-cli compile --fqbn "esp32:esp32:esp32:PartitionScheme=default_8MB,FlashSize=8M" examples/arduino/${{ matrix.example.name }}