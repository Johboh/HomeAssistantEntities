name: Push to PlatformIO registry
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check_existing_ci:
    runs-on: ubuntu-latest
    outputs:
      already_verified: ${{ steps.check.outputs.already_verified }}
    steps:
      - name: Check if PlatformIO CI already passed for this commit
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.sha,
              per_page: 100,
            });
            const passed = data.workflow_runs.some(
              (run) =>
                run.path === '.github/workflows/platformio.yaml' &&
                run.status === 'completed' &&
                run.conclusion === 'success'
            );
            core.info(`PlatformIO CI already passed for ${context.sha}: ${passed}`);
            core.setOutput('already_verified', passed ? 'true' : 'false');

  build_examples_for_verification:
    needs: [check_existing_ci]
    if: needs.check_existing_ci.outputs.already_verified != 'true'
    uses: ./.github/workflows/platformio.yaml

  upload_library:
    runs-on: ubuntu-latest
    needs: [check_existing_ci, build_examples_for_verification]
    if: ${{ !cancelled() && needs.check_existing_ci.result == 'success' && (needs.check_existing_ci.outputs.already_verified == 'true' || needs.build_examples_for_verification.result == 'success') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Publish PlatformIO library
        run: pio pkg publish --owner johboh --no-notify --no-interactive
        env:
          PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}