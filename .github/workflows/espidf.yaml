name: ESP-IDF CI
on: [workflow_call, push]
jobs:
  esp_idf_build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - name: v53_build
            version_number: release-v5.3
            target: esp32c6
          - name: v54_build
            version_number: release-v5.4
            target: esp32c6
          - name: v55_build
            version_number: release-v5.5
            target: esp32c6
          - name: v60_build
            version_number: release-v6.0
            target: esp32c6
          - name: v61_build
            version_number: release-v6.1
            target: esp32c6
        example:
          - name: actuators
          - name: sensors
          - name: all
          - name: child_devices
          - name: gateway_and_lifecycle

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: ESP-IDF Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.version.version_number }}
          target: ${{ matrix.version.target }}
          path: examples/espidf/${{ matrix.example.name }}